services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?กรุณากำหนด POSTGRES_PASSWORD}
      POSTGRES_DB: moviehub
    ports:
      - "5433:5432"
    volumes:
      - moviehub_data:/var/lib/postgresql/data

volumes:
  moviehub_data:
